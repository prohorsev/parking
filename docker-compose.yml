services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: parking
      POSTGRES_PASSWORD: parking
      POSTGRES_DB: parking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking -d parking"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://parking:parking@postgres:5432/parking?sslmode=disable"
      LISTEN_ADDR: ":8080"
      MIGRATIONS_PATH: "./migrations"
      PROVIDER_A_PORT: "9001"
      PROVIDER_B_PORT: "9002"
      REFRESH_INTERVAL: "60s"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
